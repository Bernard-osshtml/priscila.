<title>Para Você</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Inter:wght@400&display=swap">
<style>
/* Layout: palco 3D em tela cheia sobre um fundo ameixa escuro; mensagem em itálico serifado centralizada embaixo. */
:root{--bg:#dcb4b8;--bg2:#fbe9e2;--ink:#5a2a3d;--dim:#9a6f7e;--rose:#e0457e;color-scheme:light;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--sans)}
body{position:relative;background:radial-gradient(ellipse 90% 70% at 50% 42%,var(--bg2) 0%,#efd0cd 58%,var(--bg) 100%)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#c.drag{cursor:grabbing}
#msg{position:absolute;left:0;right:0;bottom:9%;text-align:center;font-family:var(--serif);font-style:italic;font-weight:500;
  font-size:clamp(28px,6.4vw,46px);letter-spacing:.02em;color:var(--ink);pointer-events:none;
  opacity:0;transform:translateY(10px);transition:opacity 1.6s ease,transform 1.6s ease;text-wrap:balance;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#msg.show{opacity:1;transform:none}
#msg i{font-style:normal;color:var(--rose)}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  padding-top:0;padding-bottom:12px;font-size:12px;color:var(--dim);letter-spacing:.02em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#again{background:rgba(255,255,255,.55);border:1px solid #d9aebb;color:var(--dim);font:inherit;padding:6px 12px;border-radius:999px;cursor:pointer}
#again:hover,#again:focus-visible{color:var(--ink);border-color:var(--rose);outline:none}
.gate-hidden{}
#gate{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,4vh,34px);
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));
  transition:opacity .9s ease,transform .9s ease}
#gate.gone{opacity:0;transform:scale(1.06);pointer-events:none}
#gtxt{margin:0;font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(38px,10vw,64px);letter-spacing:.02em;color:var(--ink);
  animation:pulse 2.4s ease-in-out infinite}
#gtxt i{font-style:normal;color:var(--rose)}
#cat{appearance:none;background:none;border:0;padding:8px;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;
  animation:bob 2.6s ease-in-out infinite;transition:transform .2s ease;filter:drop-shadow(0 10px 14px rgba(110,50,65,.28))}
#cat img{display:block;width:min(64vw,300px);height:auto;pointer-events:none}
#cat:hover{transform:scale(1.04)}
#cat:active{transform:scale(.93,1.05)}
#cat:focus-visible{outline:2px solid var(--rose);outline-offset:6px;border-radius:18px}
#gate.gone #cat{animation:none;transform:scale(1.15) translateY(-12px)}
@keyframes bob{0%,100%{translate:0 0;rotate:-1.5deg}50%{translate:0 -9px;rotate:1.5deg}}
@keyframes pulse{0%,100%{opacity:.78}50%{opacity:1}}
#bar{opacity:0;pointer-events:none;transition:opacity 1.2s ease 1s}
body.go #bar{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){#cat,#gtxt{animation:none}}
</style>

<script>
(()=>{
'use strict';
/* ====== Personalize aqui ====== */
const MESSAGE='Eu te amo';
const HEART='♥';
/* ================================ */
const TAU=Math.PI*2;
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- utilidades ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry(20261123);
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const sm=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const easeOutBack=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const easeOutCubic=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const hash=(a,b)=>{const s=Math.sin(a*127.1+b*311.7)*43758.5453;return s-Math.floor(s)};
const mixc=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
const scl=(a,k)=>[a[0]*k,a[1]*k,a[2]*k];
const norm=v=>{const l=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/l,v[1]/l,v[2]/l]};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const lin=x=>Math.pow(clamp(x/255),2.2);

/* ---------- paleta dos lírios ---------- */
const C_DEEP=[214,26,112],C_MID=[255,84,158],C_EDGE=[255,196,220],C_THROAT=[196,214,104],C_RIB=[255,176,208],C_SPOT=[100,8,52];
function tepalW(s){return 0.1*(1-s)+Math.pow(Math.sin(Math.PI*Math.pow(s,1.35)),0.85)}
function leafW(s){return 0.04*(1-s)+Math.pow(Math.sin(Math.PI*Math.pow(s,0.8)),0.75)}
function frontCol(s,v,type){
  const av=Math.abs(v);
  let c=mixc(C_MID,C_EDGE,sm(0.45,1.0,av)*0.5);
  c=mixc(c,C_DEEP,(1-sm(0.12,0.8,s))*(1-sm(0.15,0.7,av))*0.9);
  c=mixc(c,C_EDGE,sm(0.8,1.0,s)*0.25);
  c=mixc(c,C_THROAT,(1-sm(0.0,0.1,s))*0.8);
  if(av<0.09)c=mixc(c,C_RIB,0.45*sm(0.1,0.3,s));
  const hh=hash(s*61+type*3.1,v*37);
  if(hh>0.935&&s>0.12&&s<0.75)c=mixc(c,C_SPOT,0.85);
  return scl(c,0.9+0.1*Math.sin(v*16+s*3));
}
function backCol(s,v){
  const av=Math.abs(v);
  let c=mixc([238,140,184],[250,205,224],sm(0.3,1,av)*0.8);
  c=mixc(c,[120,184,104],(av<0.14?0.7:0)*sm(0.05,0.2,s));
  c=mixc(c,[116,190,96],1-sm(0,0.22,s));
  return c;
}
function leafFront(s,v){
  const av=Math.abs(v);
  let c=mixc([48,122,58],[100,182,88],sm(0.2,1,av)*0.7+s*0.2);
  if(av<0.07)c=mixc(c,[160,214,126],0.7);
  return c;
}
const leafBack=(s,v)=>scl(leafFront(s,v),0.9);

function makeBlade(nu,nv,wmax,kind){
  const N=(nu+1)*nv;
  const b={nu,nv,wmax,kind,N,w:new Float32Array(nu+1),vg:new Float32Array(nv),
    rc:new Float32Array(nu+1),yc:new Float32Array(nu+1),th:new Float32Array(nu+1),
    cfL:new Float32Array(N*3),cbL:new Float32Array(N*3)};
  for(let i=0;i<=nu;i++){const s=i/nu;b.w[i]=kind===2?leafW(s):tepalW(s)}
  for(let j=0;j<nv;j++)b.vg[j]=-1+2*j/(nv-1);
  let k=0;
  for(let i=0;i<=nu;i++)for(let j=0;j<nv;j++,k++){
    const s=i/nu,v=b.vg[j];
    const f=kind===2?leafFront(s,v):frontCol(s,v,kind);
    const bk=kind===2?leafBack(s,v):backCol(s,v);
    for(let q=0;q<3;q++){b.cfL[k*3+q]=lin(f[q]);b.cbL[k*3+q]=lin(bk[q])}
  }
  return b;
}
/* lâmina (pétala, sépala ou folha) → chama emit(x,y,z,nx,ny,nz,k) para cada vértice da grade */
function emitBlade(bl,P,ex,ey,ez,phi,S,wrap,cupk,rip,ph,vfold,emit){
  const cp=Math.cos(phi),sp=Math.sin(phi);
  const urx=ex[0]*cp+ez[0]*sp,ury=ex[1]*cp+ez[1]*sp,urz=ex[2]*cp+ez[2]*sp;
  const utx=-ex[0]*sp+ez[0]*cp,uty=-ex[1]*sp+ez[1]*cp,utz=-ex[2]*sp+ez[2]*cp;
  const eyx=ey[0],eyy=ey[1],eyz=ey[2];
  const nu=bl.nu,nv=bl.nv;
  let k=0;
  for(let i=0;i<=nu;i++){
    const rc=bl.rc[i],yc=bl.yc[i],th=bl.th[i],w=bl.w[i]*bl.wmax;
    const ct=Math.cos(th),st=Math.sin(th);
    const rpl=rip*Math.sin(i/nu*13+ph)*(i/nu);
    for(let j=0;j<nv;j++,k++){
      const v=bl.vg[j],l=v*w,av=Math.abs(v);
      const disp=cupk*l*l+rpl*av*av*av-vfold*Math.abs(l);
      const rf=rc-ct*disp,yf=yc+st*disp;
      let px=rf*urx+yf*eyx+l*utx,py=rf*ury+yf*eyy+l*uty,pz=rf*urz+yf*eyz+l*utz;
      let rdx=urx,rdy=ury,rdz=urz,tgx=utx,tgy=uty,tgz=utz;
      if(wrap>0.001){
        const da=v*0.55,cd=Math.cos(da),sd=Math.sin(da);
        const Rr=rc*(bl.kind===1?0.93:1);
        const ax=Rr*(cd*urx+sd*utx)+yc*eyx,ay=Rr*(cd*ury+sd*uty)+yc*eyy,az=Rr*(cd*urz+sd*utz)+yc*eyz;
        px+=(ax-px)*wrap;py+=(ay-py)*wrap;pz+=(az-pz)*wrap;
        rdx=urx+((cd*urx+sd*utx)-urx)*wrap;rdy=ury+((cd*ury+sd*uty)-ury)*wrap;rdz=urz+((cd*urz+sd*utz)-urz)*wrap;
        tgx=utx+((-sd*urx+cd*utx)-utx)*wrap;tgy=uty+((-sd*ury+cd*uty)-uty)*wrap;tgz=utz+((-sd*urz+cd*utz)-utz)*wrap;
      }
      const lat=2*cupk*l-(vfold?vfold*(l>0?1:-1):0);
      let nx=-ct*rdx+st*eyx-lat*tgx,ny=-ct*rdy+st*eyy-lat*tgy,nz=-ct*rdz+st*eyz-lat*tgz;
      const nl=Math.hypot(nx,ny,nz)||1;nx/=nl;ny/=nl;nz/=nl;
      emit(P[0]+S*px,P[1]+S*py,P[2]+S*pz,nx,ny,nz,k);
    }
  }
}
function setCenterline(bl,eo,kind,wob){
  const th0=kind===0?0.80:0.62,kk=kind===0?1.20:1.05,nu=bl.nu,ds=1/nu;
  const thAt=s=>(1-eo)*(0.5-s)+eo*(th0+kk*Math.pow(s,1.5))+wob*s;
  let r=0,y=0;
  bl.rc[0]=0;bl.yc[0]=0;bl.th[0]=thAt(0);
  for(let i=1;i<=nu;i++){
    const tm=thAt((i-0.5)*ds);
    r+=Math.sin(tm)*ds;y+=Math.cos(tm)*ds;
    bl.rc[i]=r<0.004?0.004:r;bl.yc[i]=y;bl.th[i]=thAt(i*ds);
  }
}
/* índice de triângulos para N lâminas em grade (nu+1)×nv */
function gridIndex(nu,nv,n,flip){
  const idx=[],per=(nu+1)*nv;
  for(let m=0;m<n;m++){const base=m*per;
    for(let i=0;i<nu;i++)for(let j=0;j<nv-1;j++){
      const a=base+i*nv+j,b=base+(i+1)*nv+j,c=a+1,d=b+1;
      if(!flip)idx.push(a,b,c,b,d,c);else idx.push(a,c,b,b,c,d);
    }
  }
  return idx;
}
function needsFlip(pos,nrm,nv){
  /* lado "de dentro" (normal n_in) deve ser a face da frente: confere o 1º quadrado no meio da lâmina */
  const i=12,j=4,a=(i*nv+j)*3,b=((i+1)*nv+j)*3,c=(i*nv+j+1)*3;
  const e1=[pos[b]-pos[a],pos[b+1]-pos[a+1],pos[b+2]-pos[a+2]],e2=[pos[c]-pos[a],pos[c+1]-pos[a+1],pos[c+2]-pos[a+2]];
  const cr=cross(e1,e2);
  return dot(cr,[nrm[a],nrm[a+1],nrm[a+2]])<0;
}

const _v=new THREE_.Vector3(),_z=new THREE_.Vector3(0,0,1);

/* ---------- papel kraft ---------- */
const paperR=f=>PAPER_R0+(PAPER_R1-PAPER_R0)*Math.pow(f,1.35);
function buildPaper(){
  const NP=200,NF=48,pos=[],nrm=[],col=[],idx=[];
  for(let a=0;a<=NP;a++){
    const phi=a/NP*TAU;
    const dphi=Math.atan2(Math.sin(phi-Math.PI/2),Math.cos(phi-Math.PI/2));
    const rim=1+0.10*Math.sin(3*phi+0.6)+0.05*Math.sin(7*phi+1)-0.30*Math.exp(-(dphi*dphi)/0.64);
    for(let q=0;q<=NF;q++){
      const f=q/NF*rim;
      const fold=0.09*Math.sin(5*phi+0.4)+0.05*Math.sin(9*phi+2.0)+0.025*Math.sin(15*phi);
      const dfold=0.45*Math.cos(5*phi+0.4)+0.45*Math.cos(9*phi+2.0)+0.375*Math.cos(15*phi);
      const m=1+f*fold,dm=f*dfold,flare=1+0.10*sm(0.8,1.0,f/rim);
      const r=paperR(Math.min(f,1))*m*flare,y=PAPER_Y0+f*PAPER_H;
      const cph=Math.cos(phi),sph=Math.sin(phi);
      let n=norm([cph*PAPER_H,-(PAPER_R1-PAPER_R0)*1.2,sph*PAPER_H]);
      const k=dm/m;n=norm([n[0]+k*sph,n[1],n[2]-k*cph]);
      const h=hash(a*0.37,q*1.13);
      const crease=0.86+0.14*Math.sin(5*phi+0.4+f)+0.05*(h-0.5);
      const c=scl(mixc([232,192,178],[252,234,220],sm(0.1,0.95,f)),crease*(0.96+0.06*h));
      pos.push(r*cph,y,r*sph);nrm.push(n[0],n[1],n[2]);col.push(lin(c[0]),lin(c[1]),lin(c[2]));
    }
  }
  for(let a=0;a<NP;a++)for(let q=0;q<NF;q++){
    const A=a*(NF+1)+q,B=(a+1)*(NF+1)+q;
    idx.push(A,A+1,B,B,A+1,B+1);
  }
  const g=new THREE_.BufferGeometry();
  g.setAttribute('position',new THREE_.Float32BufferAttribute(pos,3));g.setAttribute('normal',new THREE_.Float32BufferAttribute(nrm,3));
  g.setAttribute('color',new THREE_.Float32BufferAttribute(col,3));g.setIndex(idx);
  const m=new THREE_.Mesh(g,matStd({vertexColors:true,roughness:0.9,side:THREE_.DoubleSide,emissive:0x3a2a22,emissiveIntensity:0.45}));
  m.frustumCulled=false;bq.add(m);
}

/* ---------- caules ---------- */
function bez(p0,p1,p2,p3,t){
  const u=1-t,a=u*u*u,b=3*u*u*t,c=3*u*t*t,d=t*t*t;
  return new THREE_.Vector3(a*p0[0]+b*p1[0]+c*p2[0]+d*p3[0],a*p0[1]+b*p1[1]+c*p2[1]+d*p3[1],a*p0[2]+b*p1[2]+c*p2[2]+d*p3[2]);
}
const stemMat=matStd({color:new THREE_.Color(lin(78),lin(156),lin(64)),roughness:0.55});
function buildStem(f){
  /* Os caules saem da base de cada flor e convergem para um feixe
     estreito dentro da embalagem, sem perfurar a ponta inferior do papel. */
  const jx=(rnd()-0.5)*0.18,jz=(rnd()-0.5)*0.18;
  const p0=f.p.slice();
  const p1=[
    p0[0]-f.ey[0]*0.85,
    p0[1]-f.ey[1]*0.85,
    p0[2]-f.ey[2]*0.85
  ];
  const p2=[p0[0]*0.28+jx*1.5,-1.85,p0[2]*0.28+jz*1.5];
  /* Termina acima do fundo e perto do centro, dentro do papel kraft. */
  const p3=[jx,-3.28,jz];
  const pts=[];
  for(let i=0;i<=24;i++)pts.push(bez(p0,p1,p2,p3,i/24));
  const curve=new THREE_.CatmullRomCurve3(pts);
  const geo=new THREE_.TubeGeometry(curve,64,0.028,7,false);
  const m=new THREE_.Mesh(geo,stemMat);
  m.frustumCulled=false;
  bq.add(m);
}

/* ---------- folhas ---------- */
function buildLeaves(){
  const nu=leafBlade.nu,ds=1/nu;
  const thAt=s=>0.12+1.3*Math.pow(s,1.6);
  let r=0,y=0;leafBlade.rc[0]=0;leafBlade.yc[0]=0;leafBlade.th[0]=thAt(0);
  for(let i=1;i<=nu;i++){const tm=thAt((i-0.5)*ds);r+=Math.sin(tm)*ds;y+=Math.cos(tm)*ds;leafBlade.rc[i]=r;leafBlade.yc[i]=y;leafBlade.th[i]=thAt(i*ds)}
  const N=13,per=leafBlade.N;
  const leaves=[];
  for(let q=0;q<N;q++){
    const phi=Math.PI*(0.1+1.8*q/(N-1))+rnd()*0.2;
    const rb=1.2+rnd()*0.8,yb=-0.6+rnd()*0.9;
    const P=[Math.cos(phi)*rb,yb,Math.sin(phi)*rb];
    const ey=norm([Math.cos(phi)*0.5,0.85,Math.sin(phi)*0.5]);
    const ex=norm(cross([0,1,0],ey)),ez=cross(ex,ey);
    const o=[Math.cos(phi),0,Math.sin(phi)];
    const az=Math.atan2(dot(o,ez),dot(o,ex));
    const S=1.7+rnd()*0.7;
    const pos=new Float32Array(per*3),nrm=new Float32Array(per*3);
    emitBlade(leafBlade,ZERO,ex,ey,ez,az,S,0,0.1,0.02,q,0.35,(x,y2,z,nx,ny,nz,k)=>{pos[k*3]=x;pos[k*3+1]=y2;pos[k*3+2]=z;nrm[k*3]=nx;nrm[k*3+1]=ny;nrm[k*3+2]=nz});
    const flip=needsFlip(pos,nrm,leafBlade.nv);
    const idx=gridIndex(nu,leafBlade.nv,1,flip);
    const gA=new THREE_.BufferGeometry(),gB=new THREE_.BufferGeometry();
    const aP=new THREE_.BufferAttribute(pos,3),aN=new THREE_.BufferAttribute(nrm,3);
    gA.setAttribute('position',aP);gA.setAttribute('normal',aN);gA.setAttribute('color',new THREE_.BufferAttribute(leafBlade.cfL,3));gA.setIndex(idx);
    gB.setAttribute('position',aP);gB.setAttribute('normal',aN);gB.setAttribute('color',new THREE_.BufferAttribute(leafBlade.cbL,3));gB.setIndex(idx);
    const g=twoSided(gA,gB,matLeafF,matLeafB);g.position.set(P[0],P[1],P[2]);g.scale.setScalar(0.001);
    g.userData.start=0.9+q*0.12;g.userData.phase=phi+q*0.37;bq.add(g);leaves.push(g);
  }
  return leaves;
}

function buildGypso(){
  const sprays=[],NS=8,_m=new THREE_.Matrix4(),_c=new THREE_.Color();

    const L=2.4+rnd()*1.3;

    const main=t=>[dir[0]*L*t+bend[0]*t*t,dir[1]*L*t+bend[1]*t*t,dir[2]*L*t+bend[2]*t*t];
    const seg=[],fl=[];

    const nb=7+Math.floor(rnd()*3);
    for(let b=0;b<nb;b++){
      const t=0.3+0.7*(b/nb)+rnd()*0.05;
      const bp=main(t),tp=main(Math.min(1,t+0.02));
      const T=norm([tp[0]-bp[0],tp[1]-bp[1],tp[2]-bp[2]]);
      const rd=norm([(rnd()-0.5),(rnd()-0.5)*0.6,(rnd()-0.5)]);
      const bd=norm([T[0]*0.6+rd[0],T[1]*0.6+rd[1]+0.2,T[2]*0.6+rd[2]]);
      const bl=0.35+rnd()*0.5;
      let pv=bp;
      for(let i=1;i<=8;i++){
        const u=i/8;
        const p=[bp[0]+bd[0]*bl*u,bp[1]+bd[1]*bl*u+0.12*u*u,bp[2]+bd[2]*bl*u];
        addSeg(pv,p);pv=p;
        if(i>=4&&i%2===0||i===8){
          const nf=2+Math.floor(rnd()*2);
          for(let k=0;k<nf;k++)fl.push([p[0]+(rnd()-0.5)*0.15,p[1]+(rnd()-0.5)*0.15,p[2]+(rnd()-0.5)*0.15,0.7+rnd()*0.8,rnd()<0.18]);
        }
      }
    }
    const g=new THREE_.Group();g.position.set(O[0],O[1],O[2]);
    const lg=new THREE_.BufferGeometry();lg.setAttribute('position',new THREE_.Float32BufferAttribute(seg,3));
    const ls=new THREE_.LineSegments(lg,gypMat);ls.frustumCulled=false;g.add(ls);
    const im=new THREE_.InstancedMesh(gypFlowerGeo,gypFlowerMat,fl.length);
    fl.forEach((f,i)=>{_m.makeScale(f[3],f[3],f[3]);_m.setPosition(f[0],f[1],f[2]);im.setMatrixAt(i,_m);im.setColorAt(i,_c.set(f[4]?0xf3b9cf:0xf6e6e8))});
    im.frustumCulled=false;g.add(im);
    g.scale.setScalar(0.001);g.userData.start=1.0+s*0.07;g.userData.phase=phi+s*0.83;
    bq.add(g);sprays.push(g);
  }
  return sprays;
}

/* ---------- laço de ráfia ---------- */
function buildBow(){
  const raf=matStd({color:new THREE_.Color(lin(232),lin(112),lin(150)),roughness:0.35});
  const yb=PAPER_Y0+0.27*PAPER_H,rb=paperR(0.27)+0.05;
  const band=new THREE_.Mesh(new THREE_.TorusGeometry(rb,0.1,10,64),raf);
  band.rotation.x=Math.PI/2;band.position.y=yb;bq.add(band);
  const z0=rb+0.06;
  for(const sg of[-1,1]){
    for(let st=0;st<3;st++){
      const lp=new THREE_.Mesh(new THREE_.TorusGeometry(0.3+st*0.03,0.05,8,28),raf);
      lp.scale.set(1.6,0.95,1);lp.rotation.z=sg*0.45;lp.position.set(sg*0.45,yb,z0+st*0.012);bq.add(lp);
    }
  }
  for(let s=0;s<9;s++){
    const sgn=s%2?1:-1,len=0.8+rnd()*0.7,cur=0.3+rnd()*0.5,pts=[];
    for(let i=0;i<=10;i++){const u=i/10;pts.push(new THREE_.Vector3(sgn*(0.04+cur*Math.pow(u,1.5)*0.7),yb-len*u,z0+0.12*u))}
    const t=new THREE_.Mesh(new THREE_.TubeGeometry(new THREE_.CatmullRomCurve3(pts),14,0.03,5,false),raf);bq.add(t);
  }
}

/* ---------- pétalas caindo ---------- */
const petalBlade=makeBlade(9,5,0.3,1);
const petalGeo=(()=>{
  const bl=petalBlade,per=bl.N,pos=new Float32Array(per*3),nrm=new Float32Array(per*3);let k=0;
  for(let i=0;i<=bl.nu;i++){const s=i/bl.nu,w=bl.w[i]*bl.wmax;
    for(let j=0;j<bl.nv;j++,k++){
      const l=bl.vg[j]*w;
      pos[k*3]=l;pos[k*3+1]=s-0.5;pos[k*3+2]=0.9*l*l+0.1*s*s;
      let nx=-1.8*l,ny=-0.1*s,nz=1;const nl=Math.hypot(nx,ny,nz);nrm[k*3]=nx/nl;nrm[k*3+1]=ny/nl;nrm[k*3+2]=nz/nl;
    }}
  const flip=needsFlip(pos,nrm,bl.nv),idx=gridIndex(bl.nu,bl.nv,1,flip);
  const mk=col=>{const g=new THREE_.BufferGeometry();g.setAttribute('position',new THREE_.BufferAttribute(pos,3));g.setAttribute('normal',new THREE_.BufferAttribute(nrm,3));g.setAttribute('color',new THREE_.BufferAttribute(col,3));g.setIndex(idx);return g};
  return{F:mk(bl.cfL),B:mk(bl.cbL)};
})();
const petals=[];
function spawnPetal(){
  const open=FLOWERS.filter(f=>f.eo>0.95);if(!open.length)return;
  const f=open[Math.floor(rnd()*open.length)];
  const a=rnd()*TAU,rr=(0.5+rnd()*0.5)*f.S;
  const lp=new THREE_.Vector3(f.p[0]+f.ey[0]*0.2+(f.ex[0]*Math.cos(a)+f.ez[0]*Math.sin(a))*rr,f.p[1]+f.ey[1]*0.2+(f.ex[1]*Math.cos(a)+f.ez[1]*Math.sin(a))*rr,f.p[2]+f.ey[2]*0.2+(f.ex[2]*Math.cos(a)+f.ez[2]*Math.sin(a))*rr);
  bq.updateWorldMatrix(true,false);bq.localToWorld(lp);
  const g=twoSided(petalGeo.F,petalGeo.B,matFront,matBack);
  g.position.copy(lp);const size=0.6+rnd()*0.3;g.scale.setScalar(size);
  g.rotation.set(rnd()*TAU,rnd()*TAU,rnd()*TAU);
  scene.add(g);
  petals.push({g,size,vy:-(0.55+rnd()*0.3),ph:rnd()*TAU,sw:0.3+rnd()*0.35,spin:[(rnd()-0.5)*2.2,(rnd()-0.5)*2.2,(rnd()-0.5)*2.2]});
}

/* ---------- brilho no chão, anel e partículas ---------- */
function radialTex(inner,outer){
  const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,inner);g.addColorStop(1,outer);x.fillStyle=g;x.fillRect(0,0,128,128);
  return new THREE_.CanvasTexture(c);
}
const glow=new THREE_.Mesh(new THREE_.PlaneGeometry(11,11),new THREE_.MeshBasicMaterial({map:radialTex('rgba(110,50,65,0.45)','rgba(110,50,65,0)'),transparent:true,depthWrite:false,opacity:0}));
glow.rotation.x=-Math.PI/2;glow.position.y=-3.74;scene.add(glow);
const ring=new THREE_.Mesh(new THREE_.RingGeometry(0.92,1,64),new THREE_.MeshBasicMaterial({color:0xe0457e,transparent:true,depthWrite:false,opacity:0,side:THREE_.DoubleSide}));
ring.rotation.x=-Math.PI/2;ring.position.y=-3.72;scene.add(ring);
const NSP=160,spPos=new Float32Array(NSP*3),spSeed=[];
for(let i=0;i<NSP;i++){const a=rnd()*TAU,r=1.5+rnd()*3.6;spPos[i*3]=Math.cos(a)*r;spPos[i*3+1]=-3.5+rnd()*8;spPos[i*3+2]=Math.sin(a)*r;spSeed.push({sp:0.12+rnd()*0.25,ph:rnd()*TAU})}
const spGeo=new THREE_.BufferGeometry();spGeo.setAttribute('position',new THREE_.BufferAttribute(spPos,3));
const spMat=new THREE_.PointsMaterial({map:radialTex('rgba(255,255,255,1)','rgba(255,190,215,0)'),size:0.2,transparent:true,depthWrite:false,opacity:0});
const sparks=new THREE_.Points(spGeo,spMat);sparks.frustumCulled=false;scene.add(sparks);

/* ---------- montagem ---------- */
FLOWERS.forEach(frameOf);
FLOWERS.forEach(buildFlower);
FLOWERS.forEach(f=>updateFlower(f,0));
buildPaper();
FLOWERS.forEach(buildStem);
const leaves=buildLeaves();
const sprays=buildGypso();
buildBow();

/* ---------- câmera, entrada e laço ---------- */
let W=1,H=1,dist=15,yawUser=0,pitchUser=0,dragging=false,lx0=0,ly0=0;
function resize(){
  W=cvs.clientWidth||window.innerWidth;H=cvs.clientHeight||window.innerHeight;
  renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();
  const t=Math.tan(camera.fov*Math.PI/360);
  dist=Math.max(14,3.2/(t*camera.aspect));
}
cvs.addEventListener('pointerdown',e=>{dragging=true;lx0=e.clientX;ly0=e.clientY;cvs.classList.add('drag');try{cvs.setPointerCapture(e.pointerId)}catch(_){}});
cvs.addEventListener('pointermove',e=>{if(!dragging)return;yawUser+=(e.clientX-lx0)*0.008;pitchUser=clamp(pitchUser+(e.clientY-ly0)*0.004,-0.35,0.55);lx0=e.clientX;ly0=e.clientY});
const endDrag=()=>{dragging=false;cvs.classList.remove('drag')};
cvs.addEventListener('pointerup',endDrag);cvs.addEventListener('pointercancel',endDrag);

const msgEl=document.getElementById('msg');
msgEl.innerHTML=MESSAGE+' <i>'+HEART+'</i>';
let t0=performance.now()+1e7,last=performance.now(),nextPetal=11.6;
const T_MSG=12.7;
window.__seek=s=>{t0=performance.now()-s*1000;petals.splice(0).forEach(p=>scene.remove(p.g));nextPetal=s+1;msgEl.classList.remove('show')};
document.getElementById('again').addEventListener('click',()=>{window.__seek(0);nextPetal=11.6});
const gate=document.getElementById('gate');
function startShow(){
  if(gate.classList.contains('gone'))return;
  gate.classList.add('gone');document.body.classList.add('go');
  t0=performance.now()+(reduce?-16000:450);nextPetal=11.6;
  setTimeout(()=>{gate.style.display='none'},1000);
}
document.getElementById('cat').addEventListener('click',startShow);

function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  const t=(now-t0)/1000;
  if(!dragging){yawUser*=Math.exp(-dt*0.45);pitchUser*=Math.exp(-dt*0.45)}
  /* surgir: o buquê cresce do chão girando */
  const gs=easeOutBack(t/2.05);
  pivot.scale.setScalar(Math.max(0.001,gs));
  pivot.rotation.y=(1-gs)*-2.6;
  pivot.visible=t>0.02;
  glow.material.opacity=ease(t/2.0)*0.8;
  ring.scale.setScalar(0.2+clamp(t/1.8)*6);ring.material.opacity=t<1.8?(1-clamp(t/1.8))*0.6:0;
  spMat.opacity=ease((t-0.55)/2.2)*(0.72+0.18*Math.sin(t*1.35));
  /* flores: aparecem uma a uma e desabrocham por completo */
  for(let i=0;i<FLOWERS.length;i++){
    const f=FLOWERS[i];
    const revealAt=0.48+i*0.11;
    const appear=easeOutBack((t-revealAt)/0.92);
    f.g.scale.setScalar(Math.max(0.001,appear));
    const eo=ease((t-f.t0)/3.0);
    if(Math.abs(eo-f.eo)>0.002)updateFlower(f,eo);
  }
  /* folhas e raminhos com balanço leve, como se houvesse uma brisa */
  for(const g of leaves){
    const show=easeOutBack((t-g.userData.start)/0.9);
    g.scale.setScalar(Math.max(0.001,show));
    const phase=g.userData.phase||0;
    g.rotation.z=reduce?0:Math.sin(t*0.72+phase)*0.035*clamp(t/2);
    g.rotation.x=reduce?0:Math.cos(t*0.58+phase)*0.018*clamp(t/2);
  }
  for(const g of sprays){
    const show=easeOutBack((t-g.userData.start)/0.9);
    g.scale.setScalar(Math.max(0.001,show));
    const phase=g.userData.phase||0;
    g.rotation.z=reduce?0:Math.sin(t*0.9+phase)*0.025*clamp(t/2);
  }
  /* pétalas */
  if(t>nextPetal&&petals.length<9&&!reduce){spawnPetal();nextPetal=t+1.0+rnd()*1.6}
  for(let i=petals.length-1;i>=0;i--){
    const p=petals[i],g=p.g;
    g.position.y+=p.vy*dt;g.position.x+=Math.sin(t*1.3+p.ph)*p.sw*dt;g.position.z+=Math.cos(t*1.1+p.ph)*p.sw*dt;
    g.rotation.x+=p.spin[0]*dt;g.rotation.y+=p.spin[1]*dt;g.rotation.z+=p.spin[2]*dt;
    const fade=clamp((g.position.y+4.2)/1.2);g.scale.setScalar(p.size*Math.max(0.001,fade));
    if(g.position.y<-4.2){scene.remove(g);petals.splice(i,1)}
  }
  /* partículas subindo */
  for(let i=0;i<NSP;i++){
    let y=spPos[i*3+1]+spSeed[i].sp*dt;if(y>4.6)y=-3.6;spPos[i*3+1]=y;
    spPos[i*3]+=Math.sin(t*0.6+spSeed[i].ph)*0.02*dt*10;
  }
  spGeo.attributes.position.needsUpdate=true;
  if(t>T_MSG&&!msgEl.classList.contains('show'))msgEl.classList.add('show');
  /* câmera */
  const sway=reduce?0:1;
  root.rotation.y=sway*0.36*Math.sin(t*0.34)+yawUser;
  root.rotation.z=sway*0.012*Math.sin(t*0.52);
  const dolly=1+0.14*(1-easeOutCubic(t/4.2));
  const pit=0.12+sway*0.03*Math.sin(t*0.3)+pitchUser;
  camera.position.set(0,-0.1+Math.sin(pit)*dist*dolly,Math.cos(pit)*dist*dolly);
  camera.lookAt(0,-0.1,0);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
resize();window.addEventListener('resize',resize);
requestAnimationFrame(n=>{last=n;frame(n)});
})();
</script>
